name: Clipobara
options:
  bundleIdPrefix: com.clipbara
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
# Shown in Xcode's navigator (no target membership) so the spec can be edited there.
fileGroups:
  - project.yml
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6RLH7FU83R
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: 10100
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.clipbara
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_CFBundleDisplayName: Clipobara
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
targets:
  Clipobara:
    type: application
    platform: macOS
    sources:
      - path: Clipobara
    settings:
      base:
        PRODUCT_NAME: Clipobara
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Clipobara/Clipobara.entitlements
        ENABLE_APP_SANDBOX: YES
      configs:
        # Debug builds get their own bundle id so their Accessibility grant
        # coexists with the released app's (TCC keys entries by bundle id).
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.clipbara.dev
    scheme:
      testTargets:
        - ClipobaraTests
      preActions:
        # Regenerate the project when project.yml changed (no-op otherwise,
        # thanks to --use-cache). The build that triggered regeneration may
        # still use the old settings; the next one picks them up.
        - script: cd "$PROJECT_DIR" && /Users/mrbond/homebrew/bin/xcodegen --use-cache
          settingsTarget: Clipobara
  ClipobaraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipobaraTests
    dependencies:
      - target: Clipobara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipbara.ClipobaraTests
